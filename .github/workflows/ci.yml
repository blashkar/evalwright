name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker build --build-arg VERSION=ci -t evalwright:ci .
      - name: Smoke test (mock provider)
        run: docker run --rm evalwright:ci run examples/offline.yaml

  # End to end: evalwright and a real Ollama server in docker compose,
  # with a 135M-parameter model small enough for a CI runner's CPU.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the quickstart suite against Ollama
        run: |
          # Exit 1 means the run worked and some checks failed, which a tiny
          # model does; only 2 (couldn't run) or 130 fail this job.
          set +e
          docker compose run --rm evalwright run examples/quickstart.yaml --pull -m ollama:smollm2:135m
          code=$?
          echo "evalwright exited with $code"
          [ "$code" -le 1 ]
      - if: always()
        run: docker compose logs ollama | tail -50
